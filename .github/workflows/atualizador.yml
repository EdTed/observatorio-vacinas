name: Atualizar Dashboard Diariamente

# Quando este robô vai rodar?
on:
  schedule:
    - cron: '0 9 * * *' # Roda todos os dias às 09:00 (UTC) / 06:00 (Horário de Brasília)
  workflow_dispatch: # Permite que você clique em um botão para rodar manualmente

jobs:
  atualizar-dados:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dá permissão para o robô salvar os novos arquivos no repositório

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v3

      - name: Configurar o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar bibliotecas necessárias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar o Web Scraping e NLP
        env:
          # Aqui injetamos as senhas ocultas que você configurou no Passo 3
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python gerador.py

      - name: Salvar (Commit & Push) os novos dados e gráficos no repositório
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          # Adiciona o HTML, os gráficos PNG e as tabelas de dados
          git add index.html grafico_*.png noticias_e_comentarios_vacinas.*
          git commit -m "Atualização diária automatizada" || echo "Sem mudanças hoje"
          git push
